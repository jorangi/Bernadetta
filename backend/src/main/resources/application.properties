spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bernadetta?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret-key=${JWT_SECRET_KEY:bernadetta-default-dev-secret-key-change-it-in-production-32bytes!}
jwt.expiration=${JWT_EXPIRATION:3600000}